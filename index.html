<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something I Never Said</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500;1,600&family=Dancing+Script:wght@500;700&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="stage" id="stage">
    <div class="veins"></div>
    <div class="stars" id="stars"></div>
    <div class="rain" id="rain"></div>

    <div class="heading-wrap" id="headingWrap">
      <div class="headline">Something I <span>Never Said</span></div>
      <div class="subline" id="subline">on a day made for people in love, i just wanted you to know mine</div>
    </div>

    <div class="envelope-wrap" id="envelopeWrap">
      <div class="glow"></div>

      <div class="envelope" id="envelope">
        <div class="env-body"></div>

        <div class="seal-wrap" id="sealWrap">
          <div class="seal">
            <div class="seal-heart">&#10084;</div>
          </div>
          <div class="crack">
            <svg viewBox="0 0 58 58">
              <path d="M29 6 L33 22 L26 27 L34 34 L27 40 L31 52" stroke="rgba(8,46,43,0.65)" stroke-width="1.4"
                fill="none" />
            </svg>
          </div>
        </div>

        <div class="env-flap"></div>
        <div class="env-bottom-fold"></div>
      </div>
    </div>

    <div class="reveal" id="letter">
      <div class="reveal-pre">to you</div>
      <div class="reveal-main">I LOVE YOU</div>
      <div class="reveal-sub">i know your heart already has a home —<br>i just didn't want to carry this quietly
        forever.<br>no matter what happens, i'm glad to know you.</div>
      <div class="reveal-sign">— Gold</div>
    </div>

    <div class="float-hearts" id="floatHearts"></div>

    <button class="replay" id="replayBtn">&#8635; replay</button>
  </div>

  <script src="script.js"></script>

</body>

</html>
